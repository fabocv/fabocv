
<!-- Modal -->
@if (!!data &&  showModal && data.image) {
  <div 
    (click)="cerrarModal()"
    class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 animate-fade-in">
    
    <div 
      (click)="$event.stopPropagation()"
      class="relative bg-white rounded-lg shadow-2xl max-w-4xl max-h-[90vh] overflow-auto animate-scale-in">
      
      <!-- Botón Cerrar -->
      <button 
        (click)="cerrarModal()"
        class="absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white rounded-full w-10 h-10 flex items-center justify-center transition duration-200 z-10 font-bold text-lg">
        ✕
      </button>
      
      <!-- Imagen -->
      <img 
        [src]="selectedImage" 
        alt="{{data.title}}" 
        class="w-full h-auto display-block rounded-lg">
    </div>
  </div>
}
